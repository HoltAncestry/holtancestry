name: OCR PDFs in /pdf

on:
  workflow_dispatch:

jobs:
  ocr:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install OCRmyPDF and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr ghostscript qpdf python3-pip
        pip install ocrmypdf

    - name: Run OCR on PDFs
      run: |
        for file in pdf/*.pdf; do
          echo "Processing $file"
          ocrmypdf --skip-text "$file" "ocr-$file"
          mv "ocr-$file" "$file"
        done

    - name: Commit OCR'd PDFs
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add pdf/*.pdf
        git commit -m "OCR processed PDFs" || echo "No changes to commit"

    - name: Push changes
      run: |
        git push


